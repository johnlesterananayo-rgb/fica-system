<!DOCTYPE html>
<html>
<head>
  <title>Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="header">
    <img src="logo.jpeg" alt="Fidelis Logo" class="logo">
    <span class="title">FIDELIS CHILDREN'S ACADEMY</span>
    <button class="logout-btn">Logout</button>
  </div>

  <div class="layout">
    <div class="sidebar">
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="student.html">Student</a></li>
        <li><a href="calendar.html">Calendar</a></li>
        <li><a href="reports.html">Reports</a></li>
        <li><a href="settings.html" class="active">Settings</a></li>
        <li><a href="request.html">Request</a></li>
        <li><a href="logs.html">Logs</a></li>
      </ul>
    </div>

    <div class="main">
      <div class="card">
        <h2>System Settings</h2>

        <button class="toggle-btn">Change Password</button>
        <div class="settings-section hidden">
          <h3>Change Password</h3>
          <label>Old Password</label>
          <input type="password" placeholder="Enter old password">
          <label>New Password</label>
          <input type="password" placeholder="Enter new password">
          <label>Confirm New Password</label>
          <input type="password" placeholder="Re-enter new password">
          <button class="save-btn">Update Password</button>
        </div>

        <button class="toggle-btn">Theme</button>
        <div class="settings-section hidden">
          <h3>Theme</h3>
          <label>Select Theme</label>
          <select>
            <option>White Mode</option>
            <option>Dark Mode</option>
          </select>
          <button class="save-btn">Apply Theme</button>
        </div>

        <button class="toggle-btn">Notifications</button>
        <div class="settings-section hidden">
          <h3>Notifications</h3>
          <label>Enable Notifications</label>
          <select>
            <option>Enabled</option>
            <option>Disabled</option>
          </select>
          <button class="save-btn">Update Notifications</button>
        </div>

        <button class="toggle-btn">System</button>
        <div class="settings-section hidden">
          <h3>System</h3>
          <label>Backup Data</label>
          <button class="backup-btn">Backup Now</button>
          <label>Restore Data</label>
          <button class="restore-btn">Restore</button>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
