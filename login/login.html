<!DOCTYPE html>
<html>
<head>
  <title>Login - Fidelis Academy</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
<div class="header">
  <img src="logo.jpeg" alt="Fidelis Logo" class="logo">
  <span>FIDELIS CHILDREN'S ACADEMY</span>
</div>

<div class="login-card">
  <img src="logo.jpeg" alt="Fidelis Logo" class="logo-large">
  <h2>FIDELIS CHILDREN'S ACADEMY</h2>
  <p class="subtitle">Sign in to manage academy operations</p>
  
  <div class="form-group">
    <input type="text" placeholder="Username">
  </div>
  <div class="form-group">
    <input type="password" placeholder="Password">
  </div>
  
  <button class="login-btn">Log In</button>
</div>
</body>
</html>
