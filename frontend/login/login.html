<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Fidelis Academy</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="../css/fica-shared.css">
  <script src="../js/supabase.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/pages.js" defer></script>
</head>
<body data-page="login">
  <div class="overlay"></div>
  <main class="login-container">
    <img src="logo.jpeg" alt="Fidelis Academy logo" class="logo-circle">
    <h2>FIDELIS CHILDREN'S ACADEMY</h2>
    <p class="login-subtitle">Student Records Management System</p>
    <form id="login-form" novalidate>
      <label class="sr-only" for="login-email">Email</label>
      <input id="login-email" name="email" type="email" placeholder="Email address" autocomplete="username" required>
      <label class="sr-only" for="login-password">Password</label>
      <input id="login-password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit" id="login-submit">Login</button>
    </form>
    <p id="login-message" class="inline-message" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
