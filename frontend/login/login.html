<!doctype html>
<html>
  <head>
    <title>Fidelis Academy Login</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="header">
      <img src="logo.jpeg" alt="Fidelis Logo" class="logo" />
      <span class="title">FIDELIS CHILDREN'S ACADEMY</span>
    </div>

    <div class="login-body">
      <div class="login-card">
        <h2>Login</h2>
        <form>
          <label>Email</label>
          <input type="email" id="email" required />
          <label>Password</label>
          <input type="password" id="password" required />
          <button type="submit">Login</button>
        </form>
        <p id="loginMessage"></p>
      </div>
    </div>

    <div id="verifyPopup" class="popup">
      <div class="popup-content">
        <h3>Email Verification</h3>
        <p>Please enter the verification code sent to your email.</p>
        <input type="text" id="verificationCode" placeholder="Enter code" />
        <button>Verify</button>
        <button class="cancel-btn">Cancel</button>
      </div>
    </div>
    <script src="../js/supabase.js"></script>
    <script src="../js/api.js"></script>
    <script>
      const form = document.querySelector("form");
      const msg = document.getElementById("loginMessage");

      // Already signed in? Skip the login screen.
      fica.auth.getSession().then(({ data }) => {
        if (data.session) window.location.href = FICA.HOME_PAGE;
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = form.querySelector("button[type=submit]");
        btn.disabled = true;
        msg.textContent = "Signing in...";
        try {
          await signIn(
            document.getElementById("email").value.trim(),
            document.getElementById("password").value,
          );
          window.location.href = FICA.HOME_PAGE;
        } catch (err) {
          msg.textContent =
            err.message === "Invalid login credentials"
              ? "Wrong email or password."
              : err.message;
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
