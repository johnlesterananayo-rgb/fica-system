<!DOCTYPE html>
<html>
<head>
  <title>Request</title>
  <link rel="stylesheet" href="request.css">
</head>
<body>
  <div class="header">
    <img src="logo.jpeg" alt="Fidelis Logo" class="logo">
    <span class="title">FIDELIS CHILDREN'S ACADEMY</span>
    <button class="logout-btn">Logout</button>
  </div>

  <div class="layout">
    <div class="sidebar">
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="student.html">Student</a></li>
        <li><a href="calendar.html">Calendar</a></li>
        <li><a href="reports.html">Reports</a></li>
        <li><a href="settings.html">Settings</a></li>
        <li><a href="request.html" class="active">Request</a></li>
        <li><a href="logs.html">Logs</a></li>
      </ul>
    </div>

    <div class="main">
      <div class="card">
        <h2>Request Management</h2>

        <button class="add-btn">Add Request</button>

        <div class="request-form hidden">
          <h3>New Request</h3>
          <label>Last Name</label>
          <input type="text" placeholder="Enter last name">
          <label>First Name</label>
          <input type="text" placeholder="Enter first name">
          <label>Middle Name</label>
          <input type="text" placeholder="Enter middle name">
          <label>Date Needed</label>
          <input type="date">
          <label>Request Type</label>
          <select>
            <option>Form 137</option>
            <option>Form 138</option>
            <option>Good Moral</option>
            <option>Certificate of Enrollment</option>
            <option>Other</option>
          </select>
          <button class="save-btn">Save Request</button>
        </div>

        <table>
          <thead>
            <tr>
              <th>Request ID</th>
              <th>Last Name</th>
              <th>First Name</th>
              <th>Middle Name</th>
              <th>Request Type</th>
              <th>Date Needed</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="requestTableBody">

          </tbody>
        </table>

      </div>
    </div>
  </div>
</body>
</html>
