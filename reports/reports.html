<!DOCTYPE html>
<html>
<head>
  <title>Reports - Fidelis Academy</title>
  <link rel="stylesheet" href="reports.css">
</head>
<body>
  <!-- Header -->
  <div class="header">
    <img src="logo.png" alt="Fidelis Logo" class="logo">
    <span>FIDELIS CHILDREN'S ACADEMY</span>
  </div>

  <div class="dashboard">
    <!-- Sidebar -->
    <div class="sidebar">
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="request.html">Request</a></li>
        <li><a href="reports.html" class="active">Reports</a></li>
        <li><a href="student.html">Student</a></li>
        <li><a href="calendar.html">Calendar</a></li>
        <li><a href="logs.html">Logs</a></li>
        <li><a href="settings.html">Settings</a></li>
        <li><a href="logout.html">Logout</a></li>
      </ul>
    </div>

    <!-- Main Reports Area -->
    <div class="main">
      <div class="card">
        <h2>Academic Reports</h2>

        <!-- Empty Report Table -->
        <table class="report-table">
          <thead>
            <tr>
              <th>Report ID</th>
              <th>Title</th>
              <th>Date</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="4" style="text-align:center; color:#777;">
                No reports available.
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Pie Chart Placeholder -->
        <div class="report-chart">
          <h3>Report Chart</h3>
          <div class="pie-chart"></div>
          <ul class="legend">
            <li><span class="color-box active"></span> Active</li>
            <li><span class="color-box dropout"></span> Dropout</li>
            <li><span class="color-box transferred"></span> Transferred</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
